<!DOCTYPE html>
<html>

<head>
  <title>CupriFace — NativeAOT-LLVM (experimental)</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- No favicon here on purpose: the host sets one at boot from CupriApp.Icon (see the js_favicon
       import in imports.js), so the logo lives in exactly one place — Assets/logo-512.png. -->
  <script type='module' src="main.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f5f7; font-family: sans-serif; }
    #cupri { display: block; width: 100vw; height: 100vh; outline: none; }
  </style>
</head>

<body>
  <!-- The engine draws the entire UI here — same ShowcaseApp, compiled with NativeAOT-LLVM.
       It paints on the GPU (WebGL2) when the browser has one and falls back to the CPU by itself,
       at startup or mid-run; __cupri.rendererState() says which and why. data-renderer="cpu" opts
       out of the GPU, "webgl" also accepts a software-only WebGL; ?renderer=auto|webgl|cpu on the
       URL overrides it for a test. -->
  <canvas id="cupri"></canvas>
</body>

</html>
