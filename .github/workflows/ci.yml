name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]      # a version tag builds the same jobs and then publishes a Release
  pull_request:

jobs:
  # All three desktop OSes: the suite renders through Skia, and font metrics differ per platform — a
  # test that silently encoded one machine's font already slipped through once (the underline test,
  # green on Windows, red on ubuntu).
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # SkiaSharp's native raster/text stack needs fontconfig at runtime for the render tests.
      - name: Install native deps (Skia)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfontconfig1 > /dev/null

      - name: Restore
        run: dotnet restore tests/CupriFace.Tests/CupriFace.Tests.csproj

      - name: Test
        run: dotnet test tests/CupriFace.Tests/CupriFace.Tests.csproj -c Release --no-restore

  # The demo app (Viewer + DemoApp + the Silk.NET/SDL shell) built on all three desktop targets.
  # The test job above never compiles the shell, so without this a platform-specific break in the
  # host layer ships unnoticed. Each run also publishes a runnable build as an artifact.
  viewer:
    name: Viewer (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform breaking shouldn't hide the others' results
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest   # GitHub's macos-latest runners are Apple Silicon
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Skia needs fontconfig to raster text, and xvfb gives the smoke test below a display to
      # open its window on. The at-spi2/pygobject packages are for the accessibility gate further
      # down — the Linux counterpart of the FlaUI one.
      - name: Install native deps
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update -qq && sudo apt-get install -y -qq
          libfontconfig1 xvfb at-spi2-core dbus-x11 python3-gi gir1.2-atspi-2.0 > /dev/null

      - name: Restore
        run: dotnet restore samples/Viewer/Viewer.csproj -r ${{ matrix.rid }}

      # Standalone single executable: self-contained (no .NET install on the target) and one file.
      # IncludeAllContentForSelfExtract comes from the csproj and is load-bearing — see the comment
      # there; without it this exe builds and then crashes on launch.
      # NativeAOT (-p:Aot=true) is deliberately not used: it needs a C++ toolchain, and Skia/SDL
      # stay separate shared libraries, so it is smaller but NOT a single file.
      - name: Publish standalone
        run: >
          dotnet publish samples/Viewer/Viewer.csproj -c Release -r ${{ matrix.rid }}
          --self-contained -p:PublishSingleFile=true --no-restore -o publish/${{ matrix.rid }}

      # A publish that links is not a publish that runs: the single-file bundle broke Silk.NET's
      # native lookup and only showed it at startup. Launch the real exe, give it time to unpack
      # and open a window, and fail if it died.
      #
      # Linux runs the software path explicitly: CUPRIFACE_SOFTWARE is the escape hatch users can
      # still reach for, so it keeps its own gate — this proves the single-file bundle extracts,
      # the runtime starts and the SDL window opens without ever touching GL. The GL path has its
      # own blocking step below.
      - name: Smoke test (Linux, software renderer)
        if: runner.os == 'Linux'
        env:
          CUPRIFACE_SOFTWARE: '1'
        run: |
          chmod +x publish/${{ matrix.rid }}/Viewer
          xvfb-run -a stdbuf -oL -eL publish/${{ matrix.rid }}/Viewer > app.log 2>&1 &
          PID=$!
          sleep 30            # first launch unpacks ~128 MB before it opens a window
          alive=0; kill -0 $PID 2>/dev/null && alive=1
          echo "--- app output ---"; cat app.log || true; echo "--- end ---"
          if [ $alive = 1 ]; then
            echo "still running — OK"; kill $PID
          else
            echo "::error::Viewer exited during smoke test"; exit 1
          fi

      # The GL path, BLOCKING: this exact configuration (xvfb, llvmpipe, no GPU) used to die with
      # a SIGSEGV inside Skia's GL interface assembly, because Skia's egl* probes were answered by
      # glXGetProcAddressARB with fabricated non-null stubs. The loader now refuses non-GL names,
      # so this must run — it is the regression test for that fix. The trace stays on: when this
      # breaks again, the last [gl] line names the killer.
      - name: Smoke test (Linux, GL path)
        if: runner.os == 'Linux'
        env:
          CUPRIFACE_GL_DEBUG: '1'
        run: |
          xvfb-run -a stdbuf -oL -eL publish/${{ matrix.rid }}/Viewer > gl.log 2>&1 &
          PID=$!
          sleep 20
          if kill -0 $PID 2>/dev/null; then
            echo "GL path OK:"; grep -a "\[gl\]" gl.log | tail -3
            kill $PID
          else
            echo "::error::GL path died again — last 40 trace lines:"; tail -40 gl.log || true
            exit 1
          fi

      # macOS runners have a real window session (there is no xvfb equivalent, and none is
      # needed), so the app opens its window for real. Both render paths must survive: the GL
      # window, and the SDL software window behind CUPRIFACE_SOFTWARE. The GL trace stays on,
      # and if a variant dies, the step digs the faulting frames out of the macOS crash report
      # (.ips) — stdout is buffered when redirected, so an empty app.log proves nothing and the
      # crash report is the testimony that counts.
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x publish/${{ matrix.rid }}/Viewer

          smoke() {  # $1 = label; remaining args = extra VAR=VAL pairs for env
            local label="$1"; shift
            rm -f app.log "$HOME"/Library/Logs/DiagnosticReports/Viewer*.ips 2>/dev/null || true
            env "$@" CUPRIFACE_GL_DEBUG=1 publish/${{ matrix.rid }}/Viewer > app.log 2>&1 &
            local pid=$!
            sleep 25
            local alive=0; kill -0 $pid 2>/dev/null && alive=1
            echo "===== $label: alive=$alive ====="
            cat app.log || true
            [ $alive = 1 ] && kill $pid
            if [ $alive = 0 ]; then
              sleep 5   # the OS needs a moment to write the crash report
              local rep; rep=$(ls -t "$HOME"/Library/Logs/DiagnosticReports/Viewer*.ips 2>/dev/null | head -1)
              if [ -n "$rep" ]; then
                echo "--- faulting thread ($rep) ---"
                python3 - "$rep" <<'PY' || head -c 4000 "$rep"
          import json, sys
          raw = open(sys.argv[1]).read()
          first, rest = raw.split("\n", 1)
          d = json.loads(rest)
          print("exception:", d.get("exception"))
          imgs = d.get("usedImages", [])
          th = d["threads"][d.get("faultingThread", 0)]
          for f in th["frames"][:15]:
              i = f.get("imageIndex")
              img = imgs[i]["name"] if i is not None and i < len(imgs) else "?"
              print(" ", img, "+", f.get("imageOffset"), f.get("symbol", ""), f.get("symbolLocation", ""))
          PY
              else
                echo "(no crash report found)"
              fi
            fi
            return $((1 - alive))
          }

          ok=1
          smoke "GL path" || ok=0
          smoke "software (SDL) path" CUPRIFACE_SOFTWARE=1 || ok=0
          [ $ok = 1 ] || { echo "::error::macOS smoke failed — see the variants above"; exit 1; }
          echo "both paths OK"

      # Windows gets the same "does the published exe actually start" gate as the other two.
      # The single-file/self-extract failure mode this guards against (see the csproj comment)
      # is not Linux-specific.
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "publish/${{ matrix.rid }}/Viewer.exe" -PassThru
          Start-Sleep -Seconds 30
          if ($p.HasExited) {
            Write-Host "::error::Viewer exited during smoke test (exit code $($p.ExitCode))"
            exit 1
          }
          Write-Host "still running — OK"
          Stop-Process -Id $p.Id -Force

      # The Linux accessibility gate, BLOCKING: the AT-SPI sibling of the UIA one below, and held
      # to the same standard — a real AT client (pyatspi over libatspi, the channel Orca uses)
      # driving the published binary, not a mock. It stands up a private a11y bus and registry,
      # then asserts: the app registers on the bus, the tree is served with real roles and screen
      # extents, DoAction genuinely toggles a control, that change arrives back as a state-changed
      # signal, and Value.Set moves a slider.
      #
      # Why those last three and not "the call returned true": a bridge that accepts every action
      # and does nothing, or one that answers every query from a snapshot it never updates, passes
      # the weaker test and is useless to a screen-reader user.
      - name: AT-SPI smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x tools/atspi-gate.sh tools/atspi-gate.py
          dbus-run-session -- tools/atspi-gate.sh "$PWD/publish/${{ matrix.rid }}/Viewer"

      # The accessibility gate, BLOCKING: interrogate the published exe as a real UIA client
      # (FlaUI) — the same channel Narrator and NVDA use. Asserts the semantics tree is served,
      # a named checkbox toggles, a slider answers RangeValue reads AND writes, and Tab focus is
      # visible over UIA. On this GPU-less runner the app takes the SDL software path — exactly
      # what an RDP/VM user gets, so that path serving UIA is part of what's being proven.
      - name: UIA smoke test (Windows)
        if: runner.os == 'Windows'
        run: dotnet run --project tests/UiaSmoke -c Release -- publish/${{ matrix.rid }}/Viewer.exe

      - uses: actions/upload-artifact@v4
        with:
          name: viewer-${{ matrix.rid }}
          path: |
            publish/${{ matrix.rid }}/Viewer
            publish/${{ matrix.rid }}/Viewer.exe
          if-no-files-found: error

  # The NativeAOT-LLVM web host, built on BOTH hosts. Resolving a package path is not the same as
  # linking a wasm module, so this is the job that actually proves the ILC host RID is portable —
  # and stops the win-x64 hard-wiring from creeping back. Skipped on PRs: the Emscripten link is
  # several minutes per OS, which is too much to pay on every push to a branch.
  webllvm:
    name: WebLlvm (${{ matrix.os }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Emscripten arrives with the wasm-tools workload. The dotnet root is root-owned on Linux.
      - name: Install wasm tooling (Linux)
        if: runner.os == 'Linux'
        run: sudo dotnet workload install wasm-tools

      - name: Install wasm tooling (Windows)
        if: runner.os == 'Windows'
        run: dotnet workload install wasm-tools

      - name: Publish
        run: dotnet publish samples/WebLlvm/WebLlvm.csproj -c Release

      - name: Verify a wasm module came out
        shell: bash
        run: |
          f=$(find samples/WebLlvm/bin/Release -name 'dotnet.native.wasm' | head -1)
          test -n "$f" || { echo "::error::no wasm module was produced"; exit 1; }
          ls -l "$f"

  # Attach the standalone executables to a GitHub Release when a v* tag is pushed. Workflow
  # artifacts expire and need a login to fetch; a Release is permanent and public. Gated on both
  # other jobs, so a release can never ship from a red build.
  release:
    needs: [ test, viewer ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the default GITHUB_TOKEN is read-only; creating a release needs write
    steps:
      # Checkout FIRST: it cleans the working directory, which would delete downloaded artifacts.
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Zipped artifacts lose the executable bit, so the Linux build ships as a tarball that keeps
      # it — otherwise every user's first step is `chmod +x`. Windows needs no such care.
      - name: Package release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          # Search WITHIN each artifact rather than across all of them: every unix build produces a
          # file called plain `Viewer`, so an unscoped find would happily tar the macOS binary as
          # linux-x64. The search is still a find, not a hard-coded path, because upload-artifact
          # derives the archive root from the matched files.
          pack_unix() {                       # $1 = RID, e.g. linux-x64
            local bin; bin=$(find "artifacts/viewer-$1" -type f -name Viewer 2>/dev/null | head -1)
            test -n "$bin" || { echo "::error::$1 build missing from artifacts"; find artifacts; exit 1; }
            chmod +x "$bin"
            tar -C "$(dirname "$bin")" -czf "dist/CupriFace-Viewer-$GITHUB_REF_NAME-$1.tar.gz" Viewer
          }
          pack_unix linux-x64
          pack_unix osx-arm64
          WIN=$(find artifacts/viewer-win-x64 -type f -name Viewer.exe | head -1)
          test -n "$WIN" || { echo "::error::win-x64 build missing from artifacts"; find artifacts; exit 1; }
          cp "$WIN" "dist/CupriFace-Viewer-$GITHUB_REF_NAME-win-x64.exe"
          ls -l dist

      # Codec natives for the media package, from the latest GREEN Codecs run (they're built by
      # their own workflow — pinned upstream tags, minutes per OS — so they change only when that
      # workflow does). Missing artifacts are NOT fatal: CupriFace.Media still packs, just without
      # decoders for the RIDs that failed, and NativeDecoders.Available reports false there.
      - name: Fetch codec natives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow codecs.yml --status success \
                  --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -z "$RUN" ]; then echo "::warning::no successful Codecs run — packing without natives"; exit 0; fi
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            mkdir -p "native/$rid"
            gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name "cupricodecs-$rid" --dir "native/$rid" \
              || echo "::warning::codec native missing for $rid"
          done
          find native -type f -print0 | xargs -0 ls -l || true

      # The libraries themselves, so people can build against CupriFace rather than only run the
      # demo. Tag is v0.1.0; NuGet wants 0.1.0.
      - name: Pack libraries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for proj in src/CupriFace/CupriFace.csproj src/CupriFace.Shell/CupriFace.Shell.csproj \
                      src/CupriFace.Media/CupriFace.Media.csproj; do
            dotnet pack "$proj" -c Release -p:Version="$VERSION" -o dist
          done
          # The media package must actually CARRY the decoders it promises — a nupkg without
          # runtimes/ would install fine and then never play anything.
          if [ -f native/win-x64/cupricodecs.dll ]; then
            unzip -l dist/CupriFace.Media."$VERSION".nupkg > pkg.txt
            grep -q 'runtimes/win-x64/native/cupricodecs.dll' pkg.txt \
              || { echo "::error::CupriFace.Media packed without its win-x64 codec native"; cat pkg.txt; exit 1; }
          fi
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'EOF'
          Standalone builds of the Showcase demo (`samples/Viewer`) — self-contained single
          executables that need **no .NET installation**.

          | Platform | Download | Run |
          |---|---|---|
          | Windows x64 | `…-win-x64.exe` | double-click, or run it from a terminal |
          | Linux x64 | `…-linux-x64.tar.gz` | `tar xzf <file> && ./Viewer` |
          | macOS (Apple Silicon) | `…-osx-arm64.tar.gz` | `tar xzf <file> && xattr -d com.apple.quarantine Viewer && ./Viewer` |

          The macOS build is unsigned, so Gatekeeper quarantines the download — the `xattr`
          removes that flag; without it macOS refuses to start the binary.

          The first launch unpacks the bundle and takes a few seconds; later launches are ~1.5 s.

          ## Build against it

          The libraries ship here as NuGet packages (`.nupkg`, with `.snupkg` symbols):

          | Package | What it gives you |
          |---|---|
          | `CupriFace` | The engine — HTML + CSS to a Skia canvas or any RGBA buffer, bound to plain C# objects. Runs headless. |
          | `CupriFace.Shell` | The desktop host — `DesktopHost.Run(new MyApp())`. |
          | `CupriFace.Media` | Optional: WebM (VP9 + Opus) playback for `<cupri-video>`, decoders included for every desktop RID. |

          Not on nuget.org yet: download the `.nupkg` and add its folder as a local source.
          EOF
          # Idempotent: re-running a tag (or adding an asset that was missed) updates the existing
          # release rather than failing on "already exists".
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release exists — updating"
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            # --draft=false is load-bearing: deleting a tag orphans its release into an untagged
            # DRAFT, so a re-run must republish and re-associate it, not just refresh the notes.
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "CupriFace $GITHUB_REF_NAME" --notes-file notes.md --draft=false
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "CupriFace $GITHUB_REF_NAME" \
              --notes-file notes.md
          fi
