name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # SkiaSharp's native raster/text stack needs fontconfig at runtime for the render tests.
      - name: Install native deps (Skia)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1

      - name: Restore
        run: dotnet restore tests/CupriFace.Tests/CupriFace.Tests.csproj

      - name: Test
        run: dotnet test tests/CupriFace.Tests/CupriFace.Tests.csproj -c Release --no-restore
