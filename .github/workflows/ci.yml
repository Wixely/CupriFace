name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]      # a version tag builds the same jobs and then publishes a Release
  pull_request:

jobs:
  # All three desktop OSes: the suite renders through Skia, and font metrics differ per platform — a
  # test that silently encoded one machine's font already slipped through once (the underline test,
  # green on Windows, red on ubuntu).
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # SkiaSharp's native raster/text stack needs fontconfig at runtime for the render tests.
      - name: Install native deps (Skia)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libfontconfig1 > /dev/null

      - name: Restore
        run: dotnet restore tests/CupriFace.Tests/CupriFace.Tests.csproj

      - name: Test
        run: dotnet test tests/CupriFace.Tests/CupriFace.Tests.csproj -c Release --no-restore

  # The demo app (Viewer + DemoApp + the Silk.NET/SDL shell) built on all three desktop targets.
  # The test job above never compiles the shell, so without this a platform-specific break in the
  # host layer ships unnoticed. Each run also publishes a runnable build as an artifact.
  viewer:
    name: Viewer (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform breaking shouldn't hide the others' results
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest   # GitHub's macos-latest runners are Apple Silicon
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Skia needs fontconfig to raster text, and xvfb gives the smoke test below a display to
      # open its window on. The at-spi2/pygobject packages are for the accessibility gate further
      # down — the Linux counterpart of the FlaUI one.
      - name: Install native deps
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update -qq && sudo apt-get install -y -qq
          libfontconfig1 xvfb at-spi2-core dbus-x11 python3-gi gir1.2-atspi-2.0 > /dev/null

      - name: Restore
        run: dotnet restore samples/Viewer/Viewer.csproj -r ${{ matrix.rid }}

      # Standalone single executable: self-contained (no .NET install on the target) and one file.
      # IncludeAllContentForSelfExtract comes from the csproj and is load-bearing — see the comment
      # there; without it this exe builds and then crashes on launch.
      # NativeAOT (-p:Aot=true) is deliberately not used: it needs a C++ toolchain, and Skia/SDL
      # stay separate shared libraries, so it is smaller but NOT a single file.
      - name: Publish standalone
        run: >
          dotnet publish samples/Viewer/Viewer.csproj -c Release -r ${{ matrix.rid }}
          --self-contained -p:PublishSingleFile=true --no-restore -o publish/${{ matrix.rid }}

      # A publish that links is not a publish that runs: the single-file bundle broke Silk.NET's
      # native lookup and only showed it at startup. Launch the real exe, give it time to unpack
      # and open a window, and fail if it died.
      #
      # Linux runs the software path explicitly: CUPRIFACE_SOFTWARE is the escape hatch users can
      # still reach for, so it keeps its own gate — this proves the single-file bundle extracts,
      # the runtime starts and the SDL window opens without ever touching GL. The GL path has its
      # own blocking step below.
      - name: Smoke test (Linux, software renderer)
        if: runner.os == 'Linux'
        env:
          CUPRIFACE_SOFTWARE: '1'
        run: |
          chmod +x publish/${{ matrix.rid }}/Viewer
          xvfb-run -a stdbuf -oL -eL publish/${{ matrix.rid }}/Viewer > app.log 2>&1 &
          PID=$!
          sleep 30            # first launch unpacks ~128 MB before it opens a window
          alive=0; kill -0 $PID 2>/dev/null && alive=1
          echo "--- app output ---"; cat app.log || true; echo "--- end ---"
          if [ $alive = 1 ]; then
            echo "still running — OK"; kill $PID
          else
            echo "::error::Viewer exited during smoke test"; exit 1
          fi

      # The GL path, BLOCKING: this exact configuration (xvfb, llvmpipe, no GPU) used to die with
      # a SIGSEGV inside Skia's GL interface assembly, because Skia's egl* probes were answered by
      # glXGetProcAddressARB with fabricated non-null stubs. The loader now refuses non-GL names,
      # so this must run — it is the regression test for that fix. The trace stays on: when this
      # breaks again, the last [gl] line names the killer.
      - name: Smoke test (Linux, GL path)
        if: runner.os == 'Linux'
        env:
          CUPRIFACE_GL_DEBUG: '1'
        run: |
          xvfb-run -a stdbuf -oL -eL publish/${{ matrix.rid }}/Viewer > gl.log 2>&1 &
          PID=$!
          sleep 20
          if kill -0 $PID 2>/dev/null; then
            echo "GL path OK:"; grep -a "\[gl\]" gl.log | tail -3
            kill $PID
          else
            echo "::error::GL path died again — last 40 trace lines:"; tail -40 gl.log || true
            exit 1
          fi

      # macOS runners have a real window session (there is no xvfb equivalent, and none is
      # needed), so the app opens its window for real. Both render paths must survive: the GL
      # window, and the SDL software window behind CUPRIFACE_SOFTWARE. The GL trace stays on,
      # and if a variant dies, the step digs the faulting frames out of the macOS crash report
      # (.ips) — stdout is buffered when redirected, so an empty app.log proves nothing and the
      # crash report is the testimony that counts.
      - name: Smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          chmod +x publish/${{ matrix.rid }}/Viewer

          smoke() {  # $1 = label; remaining args = extra VAR=VAL pairs for env
            local label="$1"; shift
            rm -f app.log "$HOME"/Library/Logs/DiagnosticReports/Viewer*.ips 2>/dev/null || true
            env "$@" CUPRIFACE_GL_DEBUG=1 publish/${{ matrix.rid }}/Viewer > app.log 2>&1 &
            local pid=$!
            sleep 25
            local alive=0; kill -0 $pid 2>/dev/null && alive=1
            echo "===== $label: alive=$alive ====="
            cat app.log || true
            [ $alive = 1 ] && kill $pid
            if [ $alive = 0 ]; then
              sleep 5   # the OS needs a moment to write the crash report
              local rep; rep=$(ls -t "$HOME"/Library/Logs/DiagnosticReports/Viewer*.ips 2>/dev/null | head -1)
              if [ -n "$rep" ]; then
                echo "--- faulting thread ($rep) ---"
                python3 - "$rep" <<'PY' || head -c 4000 "$rep"
          import json, sys
          raw = open(sys.argv[1]).read()
          first, rest = raw.split("\n", 1)
          d = json.loads(rest)
          print("exception:", d.get("exception"))
          imgs = d.get("usedImages", [])
          th = d["threads"][d.get("faultingThread", 0)]
          for f in th["frames"][:15]:
              i = f.get("imageIndex")
              img = imgs[i]["name"] if i is not None and i < len(imgs) else "?"
              print(" ", img, "+", f.get("imageOffset"), f.get("symbol", ""), f.get("symbolLocation", ""))
          PY
              else
                echo "(no crash report found)"
              fi
            fi
            return $((1 - alive))
          }

          ok=1
          smoke "GL path" || ok=0
          smoke "software (SDL) path" CUPRIFACE_SOFTWARE=1 || ok=0
          [ $ok = 1 ] || { echo "::error::macOS smoke failed — see the variants above"; exit 1; }
          echo "both paths OK"

      # Windows gets the same "does the published exe actually start" gate as the other two.
      # The single-file/self-extract failure mode this guards against (see the csproj comment)
      # is not Linux-specific.
      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "publish/${{ matrix.rid }}/Viewer.exe" -PassThru
          Start-Sleep -Seconds 30
          if ($p.HasExited) {
            Write-Host "::error::Viewer exited during smoke test (exit code $($p.ExitCode))"
            exit 1
          }
          Write-Host "still running — OK"
          Stop-Process -Id $p.Id -Force

      # The Linux accessibility gate, BLOCKING: the AT-SPI sibling of the UIA one below, and held
      # to the same standard — a real AT client (pyatspi over libatspi, the channel Orca uses)
      # driving the published binary, not a mock. It stands up a private a11y bus and registry,
      # then asserts: the app registers on the bus, the tree is served with real roles and screen
      # extents, DoAction genuinely toggles a control, that change arrives back as a state-changed
      # signal, and Value.Set moves a slider.
      #
      # Why those last three and not "the call returned true": a bridge that accepts every action
      # and does nothing, or one that answers every query from a snapshot it never updates, passes
      # the weaker test and is useless to a screen-reader user.
      - name: AT-SPI smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x tools/atspi-gate.sh tools/atspi-gate.py
          dbus-run-session -- tools/atspi-gate.sh "$PWD/publish/${{ matrix.rid }}/Viewer"

      # The macOS accessibility gate, BLOCKING: the third sibling, driven by the AX client API —
      # the channel VoiceOver uses. Asserts what only a working bridge can produce: the app's own
      # named controls (the window chrome alone has unnamed buttons and nothing else), AXPress
      # genuinely toggling a checkbox, AXValue moving a slider, and the geometry being right — the
      # root must fill the window's content area in POINTS, which is what catches the engine's
      # logical units reaching AppKit unscaled.
      - name: NSAccessibility smoke test (macOS)
        if: runner.os == 'macOS'
        run: |
          python3 -m pip install --break-system-packages --quiet             pyobjc-framework-Cocoa pyobjc-framework-ApplicationServices ||             python3 -m pip install --quiet pyobjc-framework-Cocoa pyobjc-framework-ApplicationServices
          chmod +x tools/nsa-gate.sh tools/nsa-gate.py
          tools/nsa-gate.sh "$PWD/publish/${{ matrix.rid }}/Viewer"

      # The accessibility gate, BLOCKING: interrogate the published exe as a real UIA client
      # (FlaUI) — the same channel Narrator and NVDA use. Asserts the semantics tree is served,
      # a named checkbox toggles, a slider answers RangeValue reads AND writes, and Tab focus is
      # visible over UIA. On this GPU-less runner the app takes the SDL software path — exactly
      # what an RDP/VM user gets, so that path serving UIA is part of what's being proven.
      - name: UIA smoke test (Windows)
        if: runner.os == 'Windows'
        run: dotnet run --project tests/UiaSmoke -c Release -- publish/${{ matrix.rid }}/Viewer.exe

      - uses: actions/upload-artifact@v4
        with:
          name: viewer-${{ matrix.rid }}
          path: |
            publish/${{ matrix.rid }}/Viewer
            publish/${{ matrix.rid }}/Viewer.exe
          if-no-files-found: error

  # The NativeAOT-LLVM web host, built on BOTH hosts. Resolving a package path is not the same as
  # linking a wasm module, so this is the job that actually proves the ILC host RID is portable —
  # and stops the win-x64 hard-wiring from creeping back. Skipped on PRs: the Emscripten link is
  # several minutes per OS, which is too much to pay on every push to a branch.
  webllvm:
    name: WebLlvm (${{ matrix.os }})
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Emscripten arrives with the wasm-tools workload. The dotnet root is root-owned on Linux.
      - name: Install wasm tooling (Linux)
        if: runner.os == 'Linux'
        run: sudo dotnet workload install wasm-tools

      - name: Install wasm tooling (Windows)
        if: runner.os == 'Windows'
        run: dotnet workload install wasm-tools

      - name: Publish
        run: dotnet publish samples/WebLlvm/WebLlvm.csproj -c Release

      - name: Verify a wasm module came out
        shell: bash
        run: |
          f=$(find samples/WebLlvm/bin/Release -name 'dotnet.native.wasm' | head -1)
          test -n "$f" || { echo "::error::no wasm module was produced"; exit 1; }
          ls -l "$f"

  # THE ANDROID GATE — promoted from android-gate.yml after seventeen runs earned it (the same
  # path every accessibility gate walked: own workflow until stable green, then blocking here).
  #
  # Assertion channel: logcat. The HOST logs under tag "cupri" (first frame, view geometry, fling
  # markers); the SAMPLE's gate seams print "cupri-gate:" lines via Console, which the host
  # bridges to logcat because CoreCLR-Android has no stdout destination of its own.
  #
  # Geometry: taps are computed in the APP VIEW's own coordinate space — the host publishes its
  # view's screen origin + size on every layout, and the gate converts calibrated dp anchors
  # (pinned headlessly by MobileAppTests at the same 393-wide dp space this emulator skin gives)
  # through that line. Display-size arithmetic lands in the status bar; that lesson cost run 8.
  #
  # What is NOT claimed automatable, stated plainly: real IME COMPOSITION (adb's `input text`
  # bypasses any IME) — pinned by headless engine tests + a documented manual Gboard pass; and
  # SPOKEN TalkBack output — uiautomator proves the exposed tree, actions and geometry, what
  # TalkBack says aloud is a documented human pass, the same standard the Narrator/Orca/VoiceOver
  # gates hold.
  android:
    name: The Android host, driven on a device
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the Android workload
        run: dotnet workload install android --skip-manifest-update

      - name: Build the APKs (and prove no desktop native rode along)
        run: |
          # On a v* tag the APK carries that version, so the app's About page names the build a
          # tester is holding. Off a tag there is no meaningful number and the build stamp alone
          # distinguishes one APK from the next.
          VER=""
          case "$GITHUB_REF_NAME" in v[0-9]*) VER="-p:Version=${GITHUB_REF_NAME#v}" ;; esac
          dotnet publish samples/AndroidViewer/AndroidViewer.csproj -c Release -r android-x64 -o out/x64 $VER
          dotnet publish samples/AndroidViewer/AndroidViewer.csproj -c Release -r android-arm64 -o out/arm64 $VER
          echo "### APK size" >> $GITHUB_STEP_SUMMARY
          for f in $(find out -name "*-Signed.apk"); do
            printf '%-8s %s bytes\n' "$(basename $(dirname $f))" "$(stat -c%s $f)" | tee -a $GITHUB_STEP_SUMMARY
          done
          # The engine's props leak desktop native PACKAGES into the restore; this asserts the leak
          # stays restore-only — no linux/win/osx native may enter an Android APK.
          for f in $(find out -name "*-Signed.apk"); do
            if unzip -l "$f" | grep -E "linux-x64|linux-arm64|win-x64|win-arm64|osx-x64|osx-arm64|runtimes/"; then
              echo "::error::desktop native assets leaked into $f"
              exit 1
            fi
          done
          echo "APKs are clean of desktop natives"

      - name: Boot an emulator
        run: |
          set -x
          # sdkmanager lives under cmdline-tools, not on PATH on this image.
          SDK=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$SDK/emulator:$PATH"
          echo "PATH=$PATH" >> $GITHUB_ENV

          # /dev/kvm is root:kvm 0660 here; without this rule the emulator silently falls back
          # to pure emulation and takes minutes per boot.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "system-images;android-34;google_apis;x86_64" "platform-tools" "emulator" > /dev/null
          # avdmanager and the emulator disagree about where AVDs live unless told.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> $GITHUB_ENV
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n gate -k "system-images;android-34;google_apis;x86_64" --force
          # PIN the geometry the tap arithmetic assumes: 1080x2340 @ 440 = the 393x851 dp space
          # the layout was calibrated in headlessly.
          printf 'hw.lcd.width=1080\nhw.lcd.height=2340\nhw.lcd.density=440\n' >> "$ANDROID_AVD_HOME/gate.avd/config.ini"
          emulator -list-avds | grep -qx gate

          $SDK/emulator/emulator -avd gate -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect \
            -no-snapshot -camera-back none > emulator.log 2>&1 &

          # Every wait bounded: an unbounded adb wait hangs the job instead of failing it.
          timeout 420 adb wait-for-device
          timeout 420 adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 2; done'
          adb shell getprop sys.boot_completed | grep -q 1
          adb shell wm size
          adb shell wm density

      - name: It installs, launches, and paints
        run: |
          set -x
          adb logcat -c || true
          adb install -r out/x64/*-Signed.apk
          ACTIVITY=$(adb shell cmd package resolve-activity --brief com.cupriface.viewer | tail -1 | tr -d '\r')
          adb shell am start -n "$ACTIVITY" 2>&1 | tee start.log
          ! grep -q "Error:" start.log
          for i in $(seq 1 30); do
            adb logcat -d -s cupri:I | grep -q "FIRST FRAME" && break
            sleep 2
          done
          adb logcat -d -s cupri:I | grep -q "FIRST FRAME"

      - name: Touch, momentum, keyboard, rotation
        run: |
          set -x
          set -o pipefail   # an empty grep must not hide behind tee's exit status
          # A failed assert must explain itself: dump the app's whole story before dying.
          fail() { echo "::error::$1"; adb logcat -d -s cupri:I | tail -80; adb logcat -d | tail -40; exit 1; }
          # Taps are computed in the APP VIEW's coordinate space, not the display's: the status
          # bar sits ABOVE the view, so display-size arithmetic lands in system chrome (run 8's
          # finding). The host publishes its view's screen origin + size on every layout; the
          # gate re-reads the LAST line whenever geometry may have changed (startup, rotation).
          D=$(adb shell wm density | grep -oE '[0-9]+' | tail -1)
          geom() {
            LINE=$(adb logcat -d -s cupri:I | grep "view origin" | tail -1)
            [ -n "$LINE" ] || fail "the host never published its view geometry"
            OX=$(echo "$LINE" | grep -oE 'origin [0-9]+,[0-9]+' | grep -oE '[0-9]+' | head -1)
            OY=$(echo "$LINE" | grep -oE 'origin [0-9]+,[0-9]+' | grep -oE '[0-9]+' | tail -1)
            VW=$(echo "$LINE" | grep -oE 'size [0-9]+x[0-9]+' | grep -oE '[0-9]+' | head -1)
            VH=$(echo "$LINE" | grep -oE 'size [0-9]+x[0-9]+' | grep -oE '[0-9]+' | tail -1)
            DPW=$(( VW * 160 / D )); DPH=$(( VH * 160 / D ))
            echo "view ${VW}x${VH} at ${OX},${OY} @ $D → ${DPW}x${DPH} dp"
          }
          # tap <dpX> <dpY>: view-dp → screen px.
          tap() { adb shell input tap $(( OX + $1 * D / 160 )) $(( OY + $2 * D / 160 )); }
          geom
          # Calibrated dp anchors (MobileApp @ 393-wide): nav row centre y=dpH-28, five equal
          # fifths; Notifications switch centre (dpW-56, 99); Form's first field (dpW/2, 109).
          nav() { tap $(( DPW * (2 * $1 + 1) / 10 )) $(( DPH - 28 )); sleep 2; }

          # --- tap = activation exactly once, on finger-up ---------------------------------------
          # The emulator drops injected gestures at random (runs 13, 16 and 22 each ate a
          # different one), so every switch tap retries DELIVERY — while the assert stays exact:
          # the marker count must advance by PRECISELY one per delivered tap. A dropped tap is
          # the harness's problem; a double activation is the engine's, and still fails.
          tap_toggle() {
            local before after
            before=$(adb logcat -d -s cupri:I | grep -c 'cupri-gate: toggle=' || true)
            after=$before
            for i in 1 2 3; do
              tap "$1" "$2"
              sleep 2
              after=$(adb logcat -d -s cupri:I | grep -c 'cupri-gate: toggle=' || true)
              [ "$after" -gt "$before" ] && break
              echo "switch tap not delivered (attempt $i)"
            done
            test "$after" = "$(( before + 1 ))" || fail "one tap produced $(( after - before )) toggles"
          }
          # Warmup tap first, on Home's FIRST card (plain text — no action, and safely above the
          # third card's external link): pushes one full Down/Up through the dispatch path before
          # anything is asserted, without touching the toggle count.
          tap $(( DPW / 2 )) 100
          sleep 1
          nav 3   # Settings
          tap_toggle $(( DPW - 56 )) 99
          tap_toggle $(( DPW - 56 )) 99
          # Markers arrive on the HOST's logcat tag: the host bridges Console -> logcat,
          # because CoreCLR-Android has no stdout destination of its own. The helper proved the
          # counts; these prove the ALTERNATION (off -> on -> off).
          adb logcat -d -s cupri:I | grep "cupri-gate:" | tee gate-markers.txt || true
          grep -q "toggle=True" gate-markers.txt || fail "no toggle=True marker after the first tap"
          grep -q "toggle=False" gate-markers.txt || fail "no toggle=False after the second tap"

          # --- swipe flings with real momentum ---------------------------------------------------
          nav 1   # List
          # 250 ms, not 80: a too-short `input swipe` injects only DOWN+UP with no MOVE events,
          # so the gesture recognizer (correctly) sees a slop-bounded tap and nothing scrolls —
          # run 9's finding. 350dp over 250 ms is still ~1400 dp/s, far beyond the fling threshold.
          # DELIVERY retries (run 16: the emulator dropped an entire swipe, as run 13 dropped a
          # tap): retry the injection up to 3 times, break on the engine's own "fling started".
          # The assert stays strict and SCALES — settled travel must beat every dp the finger
          # actually put in across attempts.
          TRIES=0
          for i in 1 2 3; do
            adb shell input swipe $(( OX + DPW * D / 320 )) $(( OY + 500 * D / 160 )) \
                                  $(( OX + DPW * D / 320 )) $(( OY + 150 * D / 160 )) 250
            TRIES=$i
            sleep 1
            adb logcat -d -s cupri:I | grep -q "fling started" && break
          done
          sleep 4  # let the momentum integrator run to a stop
          adb logcat -d -s cupri:I | grep "fling settled" | tee fling.txt \
            || fail "no fling-settled marker after $TRIES swipe(s)"
          # Momentum = COAST: where the fling started (logged at finger-up, after the drag)
          # versus where it settled. Run 25 showed why finger-travel arithmetic can't work: a
          # flaky injector can deliver drag-only gestures (moves too sparse for the velocity
          # ring) before one carries a fling, and every dp those drags scrolled counts against
          # a travel-based threshold.
          START=$(adb logcat -d -s cupri:I | grep -oE 'fling started y=[0-9]+' | tail -1 | grep -oE '[0-9]+$')
          SETTLED=$(grep -oE 'y=[0-9]+' fling.txt | tail -1 | cut -d= -f2)
          echo "fling: started ${START}dp, settled ${SETTLED}dp - coast $(( SETTLED - START ))dp over $TRIES swipe(s)"
          test $(( SETTLED - START )) -gt 50 || fail "coast $(( SETTLED - START ))dp - the integrator barely ran"

          # --- the soft keyboard follows focus ---------------------------------------------------
          nav 2   # Form
          tap $(( DPW / 2 )) 109
          sleep 3
          adb shell dumpsys input_method | grep -qE "mInputShown=true|isInputViewShown=true" \
            || fail "soft keyboard did not appear on field focus"
          adb shell input keyevent 111   # Escape -> the engine blurs the field
          sleep 3
          if adb shell dumpsys input_method | grep -qE "mInputShown=true|isInputViewShown=true"; then
            fail "soft keyboard did not hide on blur"
          fi

          # --- two fingers: the one platform claim that never had a gate --------------------------
          # `adb shell input` is single-pointer, which is why this seam had no gate while every
          # other one here is driven by a real client. A device reported the tile "follows one of my
          # fingers - no scaling, no rotation"; nothing in CI could have caught that.
          nav 0    # Home, where the gesture tile lives
          sleep 1
          MT=$(adb shell getevent -pl 2>/dev/null | awk '/^add device/{d=$NF} /ABS_MT_POSITION_X/{print d; exit}' | sed 's/[[:space:]]*$//')
          [ -n "$MT" ] || fail "no multi-touch input device on this emulator - cannot drive two fingers"
          CAPS=$(adb shell getevent -pl "$MT" 2>/dev/null | sed 's/[[:space:]]*$//')
          echo "touchscreen: $MT"
          echo "$CAPS" | grep -E 'ABS_MT_' || true

          # The touchscreen reports in its OWN axis range, which is not always screen pixels — the
          # first version of this gate sent pixel coordinates into a device whose axes run to a
          # different maximum, so every event landed somewhere the tile was not and the app saw no
          # gesture at all. Read the ranges and map into them.
          axmax() { echo "$CAPS" | grep -m1 "$1" | grep -oE 'max [0-9]+' | head -1 | awk '{print $2}'; }
          MAXX=$(axmax ABS_MT_POSITION_X); MAXY=$(axmax ABS_MT_POSITION_Y)
          SW=$(adb shell wm size | grep -oE '[0-9]+x[0-9]+' | tail -1 | cut -dx -f1)
          SH=$(adb shell wm size | grep -oE '[0-9]+x[0-9]+' | tail -1 | cut -dx -f2)
          : "${MAXX:=$SW}" ; : "${MAXY:=$SH}"
          echo "axes: x<=$MAXX y<=$MAXY on a ${SW}x${SH} screen"
          dx() { echo $(( $1 * MAXX / SW )); }
          dy() { echo $(( $1 * MAXY / SH )); }

          # Tile centre, measured headlessly at 393dp wide: a 90dp square at (196,540). Fingers sit
          # 20dp either side, so both stay inside it even at full spread.
          TX=$(( OX + 196 * D / 160 )); TY=$(( OY + 540 * D / 160 ))
          SP=$(( 20 * D / 160 ))

          # Protocol B: a SLOT per finger, a tracking id to open and close each one, SYN to commit.
          # TOUCH_MAJOR and PRESSURE are sent because a contact with neither is discarded as noise
          # by some input stacks before it ever becomes a MotionEvent.
          put() {   # put <slot> <trackingId|-1> <screenX> <screenY>
            if [ "$2" = "-1" ]; then
              printf 'sendevent %s 3 47 %s;sendevent %s 3 57 -1;' "$MT" "$1" "$MT"
            else
              printf 'sendevent %s 3 47 %s;sendevent %s 3 57 %s;sendevent %s 3 48 6;sendevent %s 3 58 50;sendevent %s 3 53 %s;sendevent %s 3 54 %s;' \
                     "$MT" "$1" "$MT" "$2" "$MT" "$MT" "$MT" "$(dx $3)" "$MT" "$(dy $4)"
            fi
          }
          syn() { printf 'sendevent %s 0 0 0;' "$MT"; }
          send() { adb shell "$1" >/dev/null 2>&1 || true; }

          # Separate adb calls with real pauses between them: one long burst is delivered faster
          # than the app samples, and the whole spread can arrive coalesced into a single frame.
          send "$(put 0 100 $(( TX - SP )) $TY)$(put 1 101 $(( TX + SP )) $TY)$(printf 'sendevent %s 1 330 1;' "$MT")$(syn)"
          sleep 1
          for k in 1 2 3 4 5 6; do
            G=$(( SP + k * SP / 2 ))
            send "$(put 0 100 $(( TX - G )) $TY)$(put 1 101 $(( TX + G )) $TY)$(syn)"
            sleep 1
          done
          send "$(put 0 -1)$(put 1 -1)$(printf 'sendevent %s 1 330 0;' "$MT")$(syn)"
          sleep 2

          # `|| true` is load-bearing: under `set -e` with pipefail, a grep that matches
          # nothing kills the script HERE — so the empty-result check below, and the
          # capabilities dump written to diagnose exactly this, never ran. The step died
          # silently at the grep and reported nothing at all.
          GEST=$(adb logcat -d -s cupri:I | grep 'cupri-gate: gesture' | tail -20 || true)
          if [ -z "$GEST" ]; then
            echo "--- the touchscreen's full capabilities, for the next attempt ---"
            echo "$CAPS" | head -40
            fail "two fingers produced no gesture at all - the tile never saw them"
          fi
          echo "$GEST"
          # The value actually in doubt. One finger panning still moves the tile convincingly, so
          # scale alone would not have caught the reported bug; fingers=2 is the claim.
          echo "$GEST" | grep -q 'fingers=2' \
            || fail "the recogniser never saw TWO fingers - the second was dropped before it arrived"
          BIG=$(echo "$GEST" | grep -oE 'scale=[0-9]+\.[0-9]+' | cut -d= -f2 | sort -g | tail -1 || true)
          awk -v s="$BIG" 'BEGIN{ exit !(s > 1.3) }' \
            || fail "two fingers spread wide and scale only reached ${BIG}x - the pinch is not tracking"
          echo "two fingers: reached ${BIG}x"

          # --- rotation: relayout + the SAME dp arithmetic still lands ---------------------------
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 1
          sleep 4
          geom     # the view re-laid-out: re-read its origin and size, same anchors apply
          nav 3    # Settings (landscape)
          tap_toggle $(( DPW - 56 )) 99   # delivery-retried; still exactly one activation
          N=$(adb logcat -d -s cupri:I | grep -c 'cupri-gate: toggle=')
          test "$N" = "3" || fail "post-rotation toggles=$N (density/relayout mapping broke)"
          adb shell settings put system user_rotation 0

          echo "### Gate assertions all green" >> $GITHUB_STEP_SUMMARY
          adb logcat -d -s cupri:I | tail -20 >> $GITHUB_STEP_SUMMARY

      - name: The accessibility tree, read by a real client
        run: |
          set -x
          set -o pipefail
          fail() { echo "::error::$1"; adb logcat -d -s cupri:I | tail -60; exit 1; }
          # uiautomator IS an accessibility client: its dump contains ONLY what the view's
          # AccessibilityNodeProvider exposes — one opaque GL view, or a real virtual hierarchy.
          # The first dump also CONNECTS the client, which is what makes the view hand out the
          # provider; warm up, then give the post-frame publish a beat to land.
          # The file is DELETED first and the tool's own verdict goes to the log: run 24 spent
          # three attempts grepping a stale file because the dump was silently timing out and
          # cat kept serving the previous success.
          # A dump can fail for reasons that have nothing to do with the tree: uiautomator waits
          # for an idle window and gives up with "could not get idle state" if the app is busy.
          # Retry HERE, so callers always get either a real tree or an honest empty string, and
          # never a stale file (the path is deleted first). `|| true` throughout: the runner's
          # default shell is bash -e and a nonzero adb here must not kill the step.
          dump() {
            local try
            for try in 1 2 3; do
              adb shell rm -f /sdcard/ui.xml || true
              adb shell uiautomator dump /sdcard/ui.xml 1>&2 || true
              if adb shell test -s /sdcard/ui.xml 2>/dev/null; then
                adb shell cat /sdcard/ui.xml 2>/dev/null || true
                return 0
              fi
              echo "dump attempt $try produced nothing - retrying" 1>&2
              sleep 3
            done
            echo ""   # honest empty: the caller's own retry loop decides what that means
          }
          dump > /dev/null || true
          sleep 2
          adb logcat -d -s cupri:I | grep -q "talkback bridge attached" \
            || fail "the provider was never asked for - no accessibility client saw the view"

          # The previous step left the app on Settings (portrait, Notifications ON, 3 toggles).
          dump > ui1.xml
          for name in Home List Form Settings About; do
            grep -q "\"$name\"" ui1.xml || fail "nav '$name' missing from the accessibility tree"
          done
          SW=$(grep -o 'text="Notifications"[^>]*' ui1.xml | head -1)
          [ -n "$SW" ] || fail "the Notifications switch is missing from the accessibility tree"
          echo "$SW" | grep -q 'checked="true"' || fail "switch not checked=true (model says Notify=True)"

          # Geometry round-trip (the NSA-gate lesson): tap the centre of the DUMP'S OWN bounds.
          # Delivery-retried (the emulator drops injected taps at random) but exact: the count
          # must advance by precisely one, or the exposed geometry / activation model is wrong.
          B=$(echo "$SW" | grep -oE 'bounds="\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]"' | grep -oE '[0-9]+' | tr '\n' ' ')
          set -- $B
          BEFORE=$(adb logcat -d -s cupri:I | grep -c 'cupri-gate: toggle=' || true)
          N=$BEFORE
          for i in 1 2 3; do
            adb shell input tap $(( ($1 + $3) / 2 )) $(( ($2 + $4) / 2 ))
            sleep 2
            N=$(adb logcat -d -s cupri:I | grep -c 'cupri-gate: toggle=' || true)
            [ "$N" -gt "$BEFORE" ] && break
            echo "dump-bounds tap not delivered (attempt $i)"
          done
          test "$N" = "$(( BEFORE + 1 ))" \
            || fail "tap at the dump's own rectangle: toggles $BEFORE -> $N - exposed geometry or activation is wrong"
          dump > ui2.xml
          grep -o 'text="Notifications"[^>]*' ui2.xml | head -1 | grep -q 'checked="false"' \
            || fail "re-dump still says checked=true after the toggle"

          # The tree follows the viewport. View-space helpers, as in the touch step:
          D=$(adb shell wm density | grep -oE '[0-9]+' | tail -1)
          LINE=$(adb logcat -d -s cupri:I | grep "view origin" | tail -1)
          OX=$(echo "$LINE" | grep -oE 'origin [0-9]+,[0-9]+' | grep -oE '[0-9]+' | head -1)
          OY=$(echo "$LINE" | grep -oE 'origin [0-9]+,[0-9]+' | grep -oE '[0-9]+' | tail -1)
          VW=$(echo "$LINE" | grep -oE 'size [0-9]+x[0-9]+' | grep -oE '[0-9]+' | head -1)
          VH=$(echo "$LINE" | grep -oE 'size [0-9]+x[0-9]+' | grep -oE '[0-9]+' | tail -1)
          DPW=$(( VW * 160 / D )); DPH=$(( VH * 160 / D ))
          tap() { adb shell input tap $(( OX + $1 * D / 160 )) $(( OY + $2 * D / 160 )); }
          tap $(( DPW * 3 / 10 )) $(( DPH - 28 ))   # nav 1: List
          sleep 2
          # Deterministic start, dump-first: the earlier fling may have left the list anywhere
          # (and injections can drop — runs 13/16) — swipe toward the top only while row 3
          # isn't showing.
          for i in 1 2 3 4; do
            dump > ui3.xml
            # What did the reader ACTUALLY see? The ledger keeps proving the published tree
            # right while dumps disagree — print each dump's device mtime and first texts so
            # the failure names the tree the reader was served, not a guess about it. (ls is
            # guarded: after a failed dump the file legitimately does not exist, and the
            # runner's bash -e would turn the diagnostic itself into the killer.)
            adb shell ls -l /sdcard/ui.xml || true
            echo "dump $i texts: $(grep -o 'text="[^"]*"' ui3.xml | head -8 | tr '\n' ' ')"
            echo "dump $i individual rows: $(grep -o 'text="Row [0-9]* — tap and fling"' ui3.xml | wc -l)"
            grep -q 'text="Row 3 — tap and fling"' ui3.xml && break
            adb shell input swipe $(( OX + DPW * D / 320 )) $(( OY + 150 * D / 160 )) \
                                  $(( OX + DPW * D / 320 )) $(( OY + 500 * D / 160 )) 250
            sleep 2
          done
          grep -q 'text="Row 3 — tap and fling"' ui3.xml || fail "row 3 not exposed at the top of the list"
          if grep -q 'text="Row 400 —' ui3.xml; then fail "row 400 exposed while 19000px away"; fi
          # Fling down (delivery-retried, breaking on the engine's own "fling started"), let it
          # settle, re-dump: the early rows must have LEFT the tree (scrolled out = virtualised
          # away or clipped-not-visible — both are correct for a reader) and a later window
          # arrived.
          BASE=$(adb logcat -d -s cupri:I | grep -c "fling started" || true)
          for i in 1 2 3; do
            adb shell input swipe $(( OX + DPW * D / 320 )) $(( OY + 500 * D / 160 )) \
                                  $(( OX + DPW * D / 320 )) $(( OY + 150 * D / 160 )) 250
            sleep 1
            NOW=$(adb logcat -d -s cupri:I | grep -c "fling started" || true)
            [ "$NOW" -gt "$BASE" ] && break
          done
          sleep 4
          # The exposed window must AGREE with where the engine says the scroll settled — not
          # with a magic row number (fling velocity varies run to run; a fixed threshold sat on
          # a knife edge). Rows are 48dp: the first exposed row is the one straddling the
          # settled offset. A stale served tree sits ~5 rows low and fails this. One re-dump is
          # allowed two seconds later: if the second agrees, the staleness was a transient on
          # the CLIENT side of the a11y protocol, and the host's own "a11y at settle" ledger
          # line (in the failure tail) says which side it really was.
          S=$(adb logcat -d -s cupri:I | grep -oE 'fling settled y=[0-9]+' | tail -1 | grep -oE '[0-9]+$')
          [ -n "$S" ] || fail "no settle marker for the phase-8 fling"
          WANT=$(( S / 48 + 1 ))
          # Nothing inside this loop may hard-fail before the last attempt — an empty or thin
          # dump is a reason to look again, not a verdict (run 29 died on attempt 1 of 2 with
          # ROWS=0 from a dump that never happened). Diagnose after the loop, once.
          AGREE=0; ROWS=0; MIN=0
          for attempt in 1 2 3; do
            dump > ui4.xml
            # EXACT individual-node text, closing quote and all: run 27 revealed the list
            # CONTAINER once carried every materialised row concatenated as its own name, and
            # prefix patterns matched (or missed) that blob instead of the row nodes. The
            # engine no longer names containers from content; these patterns can only ever
            # match a real row node either way. Count occurrences, not lines: the dump is one
            # line of XML.
            ROWS=$(grep -o 'text="Row [0-9]* — tap and fling"' ui4.xml | wc -l)
            MIN=$(grep -o 'text="Row [0-9]* — tap and fling"' ui4.xml | grep -oE '[0-9]+' | sort -n | head -1)
            MIN=${MIN:-0}
            echo "attempt $attempt: $ROWS rows, first $MIN (expected ~$WANT after a ${S}dp settle)"
            if grep -q 'text="Row 3 — tap and fling"' ui4.xml; then
              fail "row 3 still exposed after a 700dp fling"        # a real contradiction: stop
            fi
            if test "$ROWS" -ge 5 && test "$MIN" -ge $(( WANT - 1 )) && test "$MIN" -le $(( WANT + 3 )); then
              AGREE=1; break
            fi
            echo "attempt $attempt texts: $(grep -o 'text="[^"]*"' ui4.xml | head -8 | tr '\n' ' ')"
            sleep 2
          done
          test "$AGREE" = "1" \
            || fail "after the fling: $ROWS rows exposed, first row $MIN, expected ~$WANT for a ${S}dp settle"

          echo "### TalkBack bridge assertions all green" >> $GITHUB_STEP_SUMMARY
          echo "switch round-trip via dump bounds; list window followed a fling ($ROWS rows exposed)" >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: androidviewer-apk
          path: out/arm64/*-Signed.apk
          if-no-files-found: error

  # Attach the standalone executables to a GitHub Release when a v* tag is pushed. Workflow
  # artifacts expire and need a login to fetch; a Release is permanent and public. Gated on the
  # test, viewer and android jobs, so a release can never ship from a red build.
  release:
    needs: [ test, viewer, android ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the default GITHUB_TOKEN is read-only; creating a release needs write
    steps:
      # Checkout FIRST: it cleans the working directory, which would delete downloaded artifacts.
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Zipped artifacts lose the executable bit, so the Linux build ships as a tarball that keeps
      # it — otherwise every user's first step is `chmod +x`. Windows needs no such care.
      - name: Package release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          # Search WITHIN each artifact rather than across all of them: every unix build produces a
          # file called plain `Viewer`, so an unscoped find would happily tar the macOS binary as
          # linux-x64. The search is still a find, not a hard-coded path, because upload-artifact
          # derives the archive root from the matched files.
          pack_unix() {                       # $1 = RID, e.g. linux-x64
            local bin; bin=$(find "artifacts/viewer-$1" -type f -name Viewer 2>/dev/null | head -1)
            test -n "$bin" || { echo "::error::$1 build missing from artifacts"; find artifacts; exit 1; }
            chmod +x "$bin"
            tar -C "$(dirname "$bin")" -czf "dist/CupriFace-Viewer-$GITHUB_REF_NAME-$1.tar.gz" Viewer
          }
          pack_unix linux-x64
          pack_unix osx-arm64
          WIN=$(find artifacts/viewer-win-x64 -type f -name Viewer.exe | head -1)
          test -n "$WIN" || { echo "::error::win-x64 build missing from artifacts"; find artifacts; exit 1; }
          cp "$WIN" "dist/CupriFace-Viewer-$GITHUB_REF_NAME-win-x64.exe"
          # The android job's gate-proven arm64 APK rides along — phones get a permanent,
          # login-free download instead of an expiring artifact.
          APK=$(find artifacts/androidviewer-apk -type f -name '*-Signed.apk' | head -1)
          test -n "$APK" || { echo "::error::android APK missing from artifacts"; find artifacts; exit 1; }
          cp "$APK" "dist/CupriFace-Viewer-$GITHUB_REF_NAME-android-arm64.apk"
          ls -l dist

      # Codec natives for the media package, from the latest GREEN Codecs run (they're built by
      # their own workflow — pinned upstream tags, minutes per OS — so they change only when that
      # workflow does). Missing artifacts are NOT fatal: CupriFace.Media still packs, just without
      # decoders for the RIDs that failed, and NativeDecoders.Available reports false there.
      - name: Fetch codec natives
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow codecs.yml --status success \
                  --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -z "$RUN" ]; then echo "::warning::no successful Codecs run — packing without natives"; exit 0; fi
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            mkdir -p "native/$rid"
            gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name "cupricodecs-$rid" --dir "native/$rid" \
              || echo "::warning::codec native missing for $rid"
          done
          find native -type f -print0 | xargs -0 ls -l || true

      # The libraries themselves, so people can build against CupriFace rather than only run the
      # demo. Tag is v0.1.0; NuGet wants 0.1.0. The Android host needs its workload to pack.
      - name: Pack libraries
        run: |
          set -euo pipefail
          dotnet workload install android --skip-manifest-update
          VERSION="${GITHUB_REF_NAME#v}"
          for proj in src/CupriFace/CupriFace.csproj src/CupriFace.Shell/CupriFace.Shell.csproj \
                      src/CupriFace.Media/CupriFace.Media.csproj \
                      src/CupriFace.Android/CupriFace.Android.csproj; do
            dotnet pack "$proj" -c Release -p:Version="$VERSION" -o dist
          done
          # The media package must actually CARRY the decoders it promises — a nupkg without
          # runtimes/ would install fine and then never play anything.
          if [ -f native/win-x64/cupricodecs.dll ]; then
            unzip -l dist/CupriFace.Media."$VERSION".nupkg > pkg.txt
            grep -q 'runtimes/win-x64/native/cupricodecs.dll' pkg.txt \
              || { echo "::error::CupriFace.Media packed without its win-x64 codec native"; cat pkg.txt; exit 1; }
          fi
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'EOF'
          Standalone builds of the Showcase demo (`samples/Viewer`) — self-contained single
          executables that need **no .NET installation**.

          | Platform | Download | Run |
          |---|---|---|
          | Windows x64 | `…-win-x64.exe` | double-click, or run it from a terminal |
          | Linux x64 | `…-linux-x64.tar.gz` | `tar xzf <file> && ./Viewer` |
          | macOS (Apple Silicon) | `…-osx-arm64.tar.gz` | `tar xzf <file> && xattr -d com.apple.quarantine Viewer && ./Viewer` |
          | Android (arm64) | `…-android-arm64.apk` | sideload: allow "install unknown apps", open the APK |

          The macOS build is unsigned, so Gatekeeper quarantines the download — the `xattr`
          removes that flag; without it macOS refuses to start the binary.

          The Android build (the phone-first sample, with the desktop Showcase reachable from
          its About page) is signed with a CI debug key that changes per build — **uninstall any
          previous CupriFace Viewer before installing a new one**, or Android refuses the update
          as a signature mismatch. A stable release signing key is a recorded follow-up.

          The first launch unpacks the bundle and takes a few seconds; later launches are ~1.5 s.

          ## Build against it

          The libraries ship here as NuGet packages (`.nupkg`, with `.snupkg` symbols):

          | Package | What it gives you |
          |---|---|
          | `CupriFace` | The engine — HTML + CSS to a Skia canvas or any RGBA buffer, bound to plain C# objects. Runs headless. |
          | `CupriFace.Shell` | The desktop host — `DesktopHost.Run(new MyApp())`. |
          | `CupriFace.Android` | The Android host — subclass `CupriActivity`, return your app. Touch, IME, TalkBack. Needs the `android` workload; runs CoreCLR (the package pins it). |
          | `CupriFace.Media` | Optional: WebM (VP9 + Opus) playback for `<cupri-video>`, decoders included for every desktop RID. |

          Not on nuget.org yet: download the `.nupkg` and add its folder as a local source.
          EOF
          # Idempotent: re-running a tag (or adding an asset that was missed) updates the existing
          # release rather than failing on "already exists". Each call is checked explicitly —
          # inside an `if` condition errexit is suspended, so a bare sequence would report the
          # LAST command's status and silently swallow a failed upload.
          publish() {
            if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "release exists — updating"
              gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber || return 1
              # --draft=false is load-bearing: deleting a tag orphans its release into an untagged
              # DRAFT, so a re-run must republish and re-associate it, not just refresh the notes.
              gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --title "CupriFace $GITHUB_REF_NAME" --notes-file notes.md --draft=false || return 1
            else
              gh release create "$GITHUB_REF_NAME" dist/* \
                --repo "$GITHUB_REPOSITORY" \
                --title "CupriFace $GITHUB_REF_NAME" \
                --notes-file notes.md || return 1
            fi
          }
          # v0.2.7 was built, packed and then LOST to a single `503 No server is currently
          # available` from api.github.com — every artifact sat finished in dist/ while the release
          # itself never appeared. Retrying costs a minute; not retrying costs the whole matrix.
          # The idempotence above is what makes this safe rather than duplicating: a half-made
          # release (created, assets missing) is finished by the next attempt's upload --clobber.
          for attempt in 1 2 3 4 5; do
            if publish; then exit 0; fi
            echo "publish attempt $attempt failed — GitHub may be having a moment; retrying in ${attempt}0s"
            sleep "${attempt}0"
          done
          echo "::error::release publish failed five times — the build is fine, the API is not"
          exit 1
