name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]      # a version tag builds the same jobs and then publishes a Release
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # SkiaSharp's native raster/text stack needs fontconfig at runtime for the render tests.
      - name: Install native deps (Skia)
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1

      - name: Restore
        run: dotnet restore tests/CupriFace.Tests/CupriFace.Tests.csproj

      - name: Test
        run: dotnet test tests/CupriFace.Tests/CupriFace.Tests.csproj -c Release --no-restore

  # The demo app (Viewer + DemoApp + the Silk.NET/SDL shell) built on both desktop targets.
  # The test job above never compiles the shell, so without this a Windows- or Linux-only break
  # in the host layer ships unnoticed. Each run also publishes a runnable build as an artifact.
  viewer:
    name: Viewer (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one platform breaking shouldn't hide the other's result
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Skia needs fontconfig to raster text, and xvfb gives the smoke test below a display to
      # open its window on.
      - name: Install native deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1 xvfb

      - name: Restore
        run: dotnet restore samples/Viewer/Viewer.csproj -r ${{ matrix.rid }}

      # Standalone single executable: self-contained (no .NET install on the target) and one file.
      # IncludeAllContentForSelfExtract comes from the csproj and is load-bearing — see the comment
      # there; without it this exe builds and then crashes on launch.
      # NativeAOT (-p:Aot=true) is deliberately not used: it needs a C++ toolchain, and Skia/SDL
      # stay separate shared libraries, so it is smaller but NOT a single file.
      - name: Publish standalone
        run: >
          dotnet publish samples/Viewer/Viewer.csproj -c Release -r ${{ matrix.rid }}
          --self-contained -p:PublishSingleFile=true --no-restore -o publish/${{ matrix.rid }}

      # A publish that links is not a publish that runs: the single-file bundle broke Silk.NET's
      # native lookup and only showed it at startup. Launch the real exe, give it time to unpack
      # and open a window, and fail if it died.
      # Linux exercises the headless `--web` mode instead of the native window. The runner has no GPU
      # and only a virtual X server, and the GL/SDL window path segfaults there (exit 139) — that is
      # the environment failing, not the binary. This still proves the single-file bundle extracts,
      # the runtime starts and the app serves; the Windows job below covers the real window path.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x publish/${{ matrix.rid }}/Viewer
          publish/${{ matrix.rid }}/Viewer --web --no-browser --port 5180 &
          PID=$!
          # First launch unpacks ~128 MB before it serves, so poll rather than sleeping a fixed time.
          for i in $(seq 1 30); do
            if ! kill -0 $PID 2>/dev/null; then echo "::error::Viewer exited during smoke test"; wait $PID; exit 1; fi
            if curl -fsS http://127.0.0.1:5180/ -o /dev/null; then echo "served OK"; kill $PID; exit 0; fi
            sleep 2
          done
          echo "::error::Viewer never served a page"; kill $PID 2>/dev/null; exit 1

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process publish/${{ matrix.rid }}/Viewer.exe -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) { Write-Host "::error::Viewer exited with $($p.ExitCode)"; exit 1 }
          Write-Host "still running — OK"; Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: viewer-${{ matrix.rid }}
          path: |
            publish/${{ matrix.rid }}/Viewer
            publish/${{ matrix.rid }}/Viewer.exe
          if-no-files-found: error

  # Attach the standalone executables to a GitHub Release when a v* tag is pushed. Workflow
  # artifacts expire and need a login to fetch; a Release is permanent and public. Gated on both
  # other jobs, so a release can never ship from a red build.
  release:
    needs: [ test, viewer ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the default GITHUB_TOKEN is read-only; creating a release needs write
    steps:
      # Checkout FIRST: it cleans the working directory, which would delete downloaded artifacts.
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Zipped artifacts lose the executable bit, so the Linux build ships as a tarball that keeps
      # it — otherwise every user's first step is `chmod +x`. Windows needs no such care.
      - name: Package release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          # Locate rather than assume: upload-artifact decides the archive root from the matched
          # files, so hard-coding a nested path is a step that only fails at release time.
          LIN=$(find artifacts -type f -name Viewer | head -1)
          WIN=$(find artifacts -type f -name Viewer.exe | head -1)
          test -n "$LIN" || { echo "::error::linux build missing from artifacts"; find artifacts; exit 1; }
          test -n "$WIN" || { echo "::error::windows build missing from artifacts"; find artifacts; exit 1; }
          chmod +x "$LIN"
          tar -C "$(dirname "$LIN")" -czf "dist/CupriFace-Viewer-$GITHUB_REF_NAME-linux-x64.tar.gz" Viewer
          cp "$WIN" "dist/CupriFace-Viewer-$GITHUB_REF_NAME-win-x64.exe"
          ls -l dist

      # The libraries themselves, so people can build against CupriFace rather than only run the
      # demo. Tag is v0.1.0; NuGet wants 0.1.0.
      - name: Pack libraries
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          for proj in src/CupriFace/CupriFace.csproj src/CupriFace.Shell/CupriFace.Shell.csproj; do
            dotnet pack "$proj" -c Release -p:Version="$VERSION" -o dist
          done
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > notes.md <<'EOF'
          Standalone builds of the Showcase demo (`samples/Viewer`) — self-contained single
          executables that need **no .NET installation**.

          | Platform | Download | Run |
          |---|---|---|
          | Windows x64 | `…-win-x64.exe` | double-click, or run it from a terminal |
          | Linux x64 | `…-linux-x64.tar.gz` | `tar xzf <file> && ./Viewer` |

          Both binaries also serve the same UI to a browser instead of opening a window:

          ```
          ./Viewer --web            # http://127.0.0.1:5180
          ```

          The first launch unpacks the bundle and takes a few seconds; later launches are ~1.5 s.

          ## Build against it

          The libraries ship here as NuGet packages (`.nupkg`, with `.snupkg` symbols):

          | Package | What it gives you |
          |---|---|
          | `CupriFace` | The engine — HTML + CSS to a Skia canvas or any RGBA buffer, bound to plain C# objects. Runs headless. |
          | `CupriFace.Shell` | The desktop host — `DesktopHost.Run(new MyApp())`. |

          Not on nuget.org yet: download the `.nupkg` and add its folder as a local source.

          Known issue: on Linux without a GPU (headless or remote/virtual X), the native window
          path can segfault — use `--web` there. See ROADMAP.md.
          EOF
          # Idempotent: re-running a tag (or adding an asset that was missed) updates the existing
          # release rather than failing on "already exists".
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release exists — updating"
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --title "CupriFace $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "CupriFace $GITHUB_REF_NAME" \
              --notes-file notes.md
          fi
