name: Android gate

# THE GATE for the Android host — blocking, in its own workflow until it has earned promotion into
# ci.yml (the same path every accessibility gate walked). One leg per phase of the Android plan.
#
# Assertion channel: logcat. The HOST logs under tag "cupri" (first frame, app switches, fling
# settling); the SAMPLE's gate seams print "cupri-gate:" marker lines via Console (which lands in
# logcat on Android). The same philosophy as the FlaUI/pyatspi/pyobjc gates — drive the real app,
# read what it actually did — adapted to adb.
#
# Geometry: tap points are computed in dp from the app's own layout (calibrated headlessly against
# the same markup the device renders — see tests/CupriFace.Tests/MobileAppTests) and converted to
# pixels with the device's reported density. The skin and density are PINNED so the arithmetic is
# stable: 1080x2340 @ 440 → 393x851 dp, the calibration space.
#
# Current legs:
#   Phase 1 — builds (both ABIs, sizes), installs, launches, paints: FIRST FRAME asserted.
#   Phase 7 — no desktop native in the APK (closes the SkiaNativeAssets story with evidence);
#             tap = activation exactly once, on finger-up (toggle marker alternates True/False);
#             swipe flings with real momentum (settled travel beyond the finger's);
#             the soft keyboard appears on field focus and leaves on blur (dumpsys mInputShown);
#             rotation relayouts and the SAME dp arithmetic still lands taps (marker fires again).
#   Phase 8 — the TalkBack bridge, driven by uiautomator (a REAL accessibility client — its dump
#             shows only what the AccessibilityNodeProvider exposes): named controls with real
#             bounds; a tap at the DUMP'S OWN rectangle flips the model and the re-dump shows the
#             new checked state (geometry round-trip); the tree's window follows a fling.
#
# What is NOT claimed automatable, stated plainly: real IME COMPOSITION (adb's `input text` sends
# hardware key events, bypassing any IME) — that behaviour is pinned by fifteen headless engine
# tests and a documented manual Gboard pass. Likewise SPOKEN TalkBack output: uiautomator proves
# the exposed tree, actions and geometry; what TalkBack says aloud is a documented human pass —
# the same standard the Narrator/Orca/VoiceOver gates hold.

on:
  workflow_dispatch:
  push:
    branches: [ main, 'feature/android-**' ]
    paths:
      - '.github/workflows/android-gate.yml'
      - 'src/CupriFace.Android/**'
      - 'samples/AndroidViewer/**'
      - 'samples/DemoApp/**'
      - 'src/CupriFace/Interaction/**'

jobs:
  gate:
    name: The Android host, driven on a device
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the Android workload
        run: dotnet workload install android --skip-manifest-update

      - name: Build the APKs (and prove no desktop native rode along)
        run: |
          dotnet publish samples/AndroidViewer/AndroidViewer.csproj -c Release -r android-x64 -o out/x64
          dotnet publish samples/AndroidViewer/AndroidViewer.csproj -c Release -r android-arm64 -o out/arm64
          echo "### APK size" >> $GITHUB_STEP_SUMMARY
          for f in $(find out -name "*-Signed.apk"); do
            printf '%-8s %s bytes\n' "$(basename $(dirname $f))" "$(stat -c%s $f)" | tee -a $GITHUB_STEP_SUMMARY
          done
          # The engine's props leak desktop native PACKAGES into the restore; this asserts the leak
          # stays restore-only — no linux/win/osx native may enter an Android APK.
          for f in $(find out -name "*-Signed.apk"); do
            if unzip -l "$f" | grep -E "linux-x64|linux-arm64|win-x64|win-arm64|osx-x64|osx-arm64|runtimes/"; then
              echo "::error::desktop native assets leaked into $f"
              exit 1
            fi
          done
          echo "APKs are clean of desktop natives"

      - name: Boot an emulator
        run: |
          set -x
          # sdkmanager lives under cmdline-tools, not on PATH on this image.
          SDK=${ANDROID_SDK_ROOT:-$ANDROID_HOME}
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$SDK/emulator:$PATH"
          echo "PATH=$PATH" >> $GITHUB_ENV

          # /dev/kvm is root:kvm 0660 here; without this rule the emulator silently falls back
          # to pure emulation and takes minutes per boot.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm || true
          ls -l /dev/kvm

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "system-images;android-34;google_apis;x86_64" "platform-tools" "emulator" > /dev/null
          # avdmanager and the emulator disagree about where AVDs live unless told.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> $GITHUB_ENV
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n gate -k "system-images;android-34;google_apis;x86_64" --force
          # PIN the geometry the tap arithmetic assumes: 1080x2340 @ 440 = the 393x851 dp space
          # the layout was calibrated in headlessly.
          printf 'hw.lcd.width=1080\nhw.lcd.height=2340\nhw.lcd.density=440\n' >> "$ANDROID_AVD_HOME/gate.avd/config.ini"
          emulator -list-avds | grep -qx gate

          $SDK/emulator/emulator -avd gate -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect \
            -no-snapshot -camera-back none > emulator.log 2>&1 &

          # Every wait bounded: an unbounded adb wait hangs the job instead of failing it.
          timeout 420 adb wait-for-device
          timeout 420 adb shell 'while [[ -z $(getprop sys.boot_completed) ]]; do sleep 2; done'
          adb shell getprop sys.boot_completed | grep -q 1
          adb shell wm size
          adb shell wm density

      - name: It installs, launches, and paints (Phase 1)
        run: |
          set -x
          adb logcat -c || true
          adb install -r out/x64/*-Signed.apk
          ACTIVITY=$(adb shell cmd package resolve-activity --brief com.cupriface.viewer | tail -1 | tr -d '\r')
          adb shell am start -n "$ACTIVITY" 2>&1 | tee start.log
          ! grep -q "Error:" start.log
          for i in $(seq 1 30); do
            adb logcat -d -s cupri:I | grep -q "FIRST FRAME" && break
            sleep 2
          done
          adb logcat -d -s cupri:I | grep -q "FIRST FRAME"

      - name: Touch, momentum, keyboard, rotation (Phase 7)
        run: |
          set -x
          set -o pipefail   # an empty grep must not hide behind tee's exit status
          # A failed assert must explain itself: dump the app's whole story before dying.
          fail() { echo "::error::$1"; adb logcat -d -s cupri:I | tail -80; adb logcat -d | tail -40; exit 1; }
          # Taps are computed in the APP VIEW's coordinate space, not the display's: the status
          # bar sits ABOVE the view, so display-size arithmetic lands in system chrome (run 8's
          # finding). The host publishes its view's screen origin + size on every layout; the
          # gate re-reads the LAST line whenever geometry may have changed (startup, rotation).
          D=$(adb shell wm density | grep -oE '[0-9]+' | tail -1)
          geom() {
            LINE=$(adb logcat -d -s cupri:I | grep "view origin" | tail -1)
            [ -n "$LINE" ] || fail "the host never published its view geometry"
            OX=$(echo "$LINE" | grep -oE 'origin [0-9]+,[0-9]+' | grep -oE '[0-9]+' | head -1)
            OY=$(echo "$LINE" | grep -oE 'origin [0-9]+,[0-9]+' | grep -oE '[0-9]+' | tail -1)
            VW=$(echo "$LINE" | grep -oE 'size [0-9]+x[0-9]+' | grep -oE '[0-9]+' | head -1)
            VH=$(echo "$LINE" | grep -oE 'size [0-9]+x[0-9]+' | grep -oE '[0-9]+' | tail -1)
            DPW=$(( VW * 160 / D )); DPH=$(( VH * 160 / D ))
            echo "view ${VW}x${VH} at ${OX},${OY} @ $D → ${DPW}x${DPH} dp"
          }
          # tap <dpX> <dpY>: view-dp → screen px.
          tap() { adb shell input tap $(( OX + $1 * D / 160 )) $(( OY + $2 * D / 160 )); }
          geom
          # Calibrated dp anchors (MobileApp @ 393-wide): nav row centre y=dpH-28, five equal
          # fifths; Notifications switch centre (dpW-56, 99); Form's first field (dpW/2, 109).
          nav() { tap $(( DPW * (2 * $1 + 1) / 10 )) $(( DPH - 28 )); sleep 2; }

          # --- tap = activation exactly once, on finger-up ---------------------------------------
          # Warmup tap first, on Home's FIRST card (plain text — no action, and safely above the
          # third card's external link): run 13 saw the emulator swallow the very first injected
          # tap of the session — this pushes one full Down/Up through the dispatch path before
          # anything is asserted, without touching the toggle count.
          tap $(( DPW / 2 )) 100
          sleep 1
          nav 3   # Settings
          tap $(( DPW - 56 )) 99
          sleep 2
          adb logcat -d -s cupri:I | grep -c 'cupri-gate: toggle=' || true   # breadcrumb after tap 1
          tap $(( DPW - 56 )) 99
          sleep 2
          # Markers arrive on the HOST's logcat tag: the host bridges Console -> logcat,
          # because CoreCLR-Android has no stdout destination of its own.
          adb logcat -d -s cupri:I | grep "cupri-gate:" | tee gate-markers.txt || true
          grep -q "toggle=True" gate-markers.txt || fail "no toggle=True marker after the first tap"
          grep -q "toggle=False" gate-markers.txt || fail "no toggle=False after the second tap"
          N=$(grep -c 'cupri-gate: toggle=' gate-markers.txt)
          test "$N" = "2" || fail "expected exactly 2 toggles (one activation per tap), got $N"

          # --- swipe flings with real momentum ---------------------------------------------------
          nav 1   # List
          # 250 ms, not 80: a too-short `input swipe` injects only DOWN+UP with no MOVE events,
          # so the gesture recognizer (correctly) sees a slop-bounded tap and nothing scrolls —
          # run 9's finding. 350dp over 250 ms is still ~1400 dp/s, far beyond the fling threshold.
          # DELIVERY retries (run 16: the emulator dropped an entire swipe, as run 13 dropped a
          # tap): retry the injection up to 3 times, break on the engine's own "fling started".
          # The assert stays strict and SCALES — settled travel must beat every dp the finger
          # actually put in across attempts.
          TRIES=0
          for i in 1 2 3; do
            adb shell input swipe $(( OX + DPW * D / 320 )) $(( OY + 500 * D / 160 )) \
                                  $(( OX + DPW * D / 320 )) $(( OY + 150 * D / 160 )) 250
            TRIES=$i
            sleep 1
            adb logcat -d -s cupri:I | grep -q "fling started" && break
          done
          sleep 4  # let the momentum integrator run to a stop
          adb logcat -d -s cupri:I | grep "fling settled" | tee fling.txt \
            || fail "no fling-settled marker after $TRIES swipe(s)"
          SETTLED=$(grep -oE 'y=[0-9]+' fling.txt | tail -1 | cut -d= -f2)
          echo "finger travelled $(( 350 * TRIES ))dp over $TRIES swipe(s); settled at ${SETTLED}dp"
          test "$SETTLED" -gt $(( 350 * TRIES )) || fail "settled ${SETTLED}dp <= finger travel - no momentum"

          # --- the soft keyboard follows focus ---------------------------------------------------
          nav 2   # Form
          tap $(( DPW / 2 )) 109
          sleep 3
          adb shell dumpsys input_method | grep -qE "mInputShown=true|isInputViewShown=true" \
            || fail "soft keyboard did not appear on field focus"
          adb shell input keyevent 111   # Escape -> the engine blurs the field
          sleep 3
          if adb shell dumpsys input_method | grep -qE "mInputShown=true|isInputViewShown=true"; then
            fail "soft keyboard did not hide on blur"
          fi

          # --- rotation: relayout + the SAME dp arithmetic still lands ---------------------------
          adb shell settings put system accelerometer_rotation 0
          adb shell settings put system user_rotation 1
          sleep 4
          geom     # the view re-laid-out: re-read its origin and size, same anchors apply
          nav 3    # Settings (landscape)
          tap $(( DPW - 56 )) 99
          sleep 2
          N=$(adb logcat -d -s cupri:I | grep -c 'cupri-gate: toggle=')
          test "$N" = "3" || fail "post-rotation tap missed, toggles=$N (density/relayout mapping broke)"
          adb shell settings put system user_rotation 0

          echo "### Gate assertions all green" >> $GITHUB_STEP_SUMMARY
          adb logcat -d -s cupri:I | tail -20 >> $GITHUB_STEP_SUMMARY

      - name: The accessibility tree, read by a real client (Phase 8)
        run: |
          set -x
          set -o pipefail
          fail() { echo "::error::$1"; adb logcat -d -s cupri:I | tail -60; exit 1; }
          # uiautomator IS an accessibility client: its dump contains ONLY what the view's
          # AccessibilityNodeProvider exposes — one opaque GL view, or a real virtual hierarchy.
          # The first dump also CONNECTS the client, which is what makes the view hand out the
          # provider; warm up, then give the post-frame publish a beat to land.
          dump() { adb shell uiautomator dump /sdcard/ui.xml > /dev/null 2>&1; adb shell cat /sdcard/ui.xml; }
          dump > /dev/null || true
          sleep 2
          adb logcat -d -s cupri:I | grep -q "talkback bridge attached" \
            || fail "the provider was never asked for - no accessibility client saw the view"

          # Phase 7 left the app on Settings (portrait, Notifications ON after three toggles).
          dump > ui1.xml
          for name in Home List Form Settings About; do
            grep -q "\"$name\"" ui1.xml || fail "nav '$name' missing from the accessibility tree"
          done
          SW=$(grep -o 'text="Notifications"[^>]*' ui1.xml | head -1)
          [ -n "$SW" ] || fail "the Notifications switch is missing from the accessibility tree"
          echo "$SW" | grep -q 'checked="true"' || fail "switch not checked=true (model says Notify=True)"

          # Geometry round-trip (the NSA-gate lesson): tap the centre of the DUMP'S OWN bounds.
          # If the exposed rectangles are wrong, this misses and the marker count stays 3.
          B=$(echo "$SW" | grep -oE 'bounds="\[[0-9]+,[0-9]+\]\[[0-9]+,[0-9]+\]"' | grep -oE '[0-9]+' | tr '\n' ' ')
          set -- $B
          adb shell input tap $(( ($1 + $3) / 2 )) $(( ($2 + $4) / 2 ))
          sleep 2
          N=$(adb logcat -d -s cupri:I | grep -c 'cupri-gate: toggle=')
          test "$N" = "4" || fail "tap at the dump's own rectangle missed (toggles=$N) - exposed geometry is wrong"
          dump > ui2.xml
          grep -o 'text="Notifications"[^>]*' ui2.xml | head -1 | grep -q 'checked="false"' \
            || fail "re-dump still says checked=true after the toggle"

          # The tree follows the viewport. View-space helpers, as in Phase 7:
          D=$(adb shell wm density | grep -oE '[0-9]+' | tail -1)
          LINE=$(adb logcat -d -s cupri:I | grep "view origin" | tail -1)
          OX=$(echo "$LINE" | grep -oE 'origin [0-9]+,[0-9]+' | grep -oE '[0-9]+' | head -1)
          OY=$(echo "$LINE" | grep -oE 'origin [0-9]+,[0-9]+' | grep -oE '[0-9]+' | tail -1)
          VW=$(echo "$LINE" | grep -oE 'size [0-9]+x[0-9]+' | grep -oE '[0-9]+' | head -1)
          VH=$(echo "$LINE" | grep -oE 'size [0-9]+x[0-9]+' | grep -oE '[0-9]+' | tail -1)
          DPW=$(( VW * 160 / D )); DPH=$(( VH * 160 / D ))
          tap() { adb shell input tap $(( OX + $1 * D / 160 )) $(( OY + $2 * D / 160 )); }
          tap $(( DPW * 3 / 10 )) $(( DPH - 28 ))   # nav 1: List
          sleep 2
          # Deterministic start, dump-first: the Phase 7 fling may have left the list anywhere
          # (and injections can drop — runs 13/16) — swipe toward the top only while row 3
          # isn't showing.
          for i in 1 2 3 4; do
            dump > ui3.xml
            grep -q 'text="Row 3 ' ui3.xml && break
            adb shell input swipe $(( OX + DPW * D / 320 )) $(( OY + 150 * D / 160 )) \
                                  $(( OX + DPW * D / 320 )) $(( OY + 500 * D / 160 )) 250
            sleep 2
          done
          grep -q 'text="Row 3 ' ui3.xml || fail "row 3 not exposed at the top of the list"
          if grep -q 'text="Row 400 ' ui3.xml; then fail "row 400 exposed while 19000px away"; fi
          # Fling down (delivery-retried, breaking on the engine's own "fling started"), let it
          # settle, re-dump: the early rows must have LEFT the tree (scrolled out = virtualised
          # away or clipped-not-visible — both are correct for a reader) and a later window
          # arrived.
          BASE=$(adb logcat -d -s cupri:I | grep -c "fling started" || true)
          for i in 1 2 3; do
            adb shell input swipe $(( OX + DPW * D / 320 )) $(( OY + 500 * D / 160 )) \
                                  $(( OX + DPW * D / 320 )) $(( OY + 150 * D / 160 )) 250
            sleep 1
            NOW=$(adb logcat -d -s cupri:I | grep -c "fling started" || true)
            [ "$NOW" -gt "$BASE" ] && break
          done
          sleep 4
          dump > ui4.xml
          if grep -q 'text="Row 3 ' ui4.xml; then fail "row 3 still exposed after a 700dp fling"; fi
          # The dump is ONE line of XML, so count OCCURRENCES (grep -c counts lines — run 14's
          # lesson: it reported 1 while a whole windowful of rows sat on that line).
          ROWS=$(grep -o 'text="Row ' ui4.xml | wc -l)
          test "$ROWS" -ge 5 || fail "only $ROWS rows exposed after the fling - the window did not follow"
          # And the arrived window must be a LATER one: ~750dp of travel / 48dp rows puts the
          # first exposed row in the mid-teens.
          MIN=$(grep -o 'text="Row [0-9]*' ui4.xml | grep -oE '[0-9]+' | sort -n | head -1)
          test "$MIN" -gt 10 || fail "first exposed row is $MIN - the window barely moved"

          echo "### TalkBack bridge assertions all green" >> $GITHUB_STEP_SUMMARY
          echo "switch round-trip via dump bounds; list window followed a fling ($ROWS rows exposed)" >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        with:
          name: androidviewer-apk
          path: out/arm64/*-Signed.apk
          if-no-files-found: error
