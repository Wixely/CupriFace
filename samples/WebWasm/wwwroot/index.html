<!DOCTYPE html>
<html>

<head>
  <title>CupriFace — Raw WASM (no Blazor)</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- No favicon here on purpose: the host sets one at boot from CupriApp.Icon, so the logo lives
       in exactly one place — Assets/logo-512.png. A copy pasted in here as base64 could only ever
       drift away from it.
       The module below comes from the CupriFace.Web package; this page is the only web-specific
       file the sample still owns. -->
  <link rel="preload" id="webassembly" />
  <script type="importmap"></script>
  <script type='module' src="_content/CupriFace.Web/main.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f5f7; font-family: sans-serif; }
    /* Fill the window so the app's Hybrid-Zoom scaling has the viewport to scale into (the same
       ShowcaseApp the desktop Viewer runs — rendered by the engine, not the browser). */
    #cupri { display: block; width: 100vw; height: 100vh; outline: none; }
  </style>
</head>

<body>
  <!-- The engine draws the entire UI here. No HTML widgets, no Blazor — just a canvas. -->
  <canvas id="cupri"></canvas>
</body>

</html>
