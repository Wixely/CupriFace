<span class="leaf-counter-label">{label}</span>
<div class="leaf-counter-controls">
  <cupri-button variant="ghost" class="leaf-counter-step" data-leaf-step="-{step}" aria-label="Decrease {label}">&#8722;</cupri-button>
  <span class="leaf-counter-value">{value}</span>
  <cupri-button variant="ghost" class="leaf-counter-step" data-leaf-step="{step}" aria-label="Increase {label}">+</cupri-button>
</div>
