<!DOCTYPE html>
<html>

<head>
  <title>CupriFace — Viewer (served)</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f5f7; font-family: sans-serif; }
    #cupri { display: block; width: 100vw; height: 100vh; outline: none; }
    #lost { position: fixed; inset: 0; display: none; place-items: center; background: #0009; color: #fff;
            font: 15px/1.5 sans-serif; text-align: center; }
  </style>
</head>

<body>
  <!-- The engine renders server-side; this canvas just shows the frames it sends back. -->
  <canvas id="cupri"></canvas>
  <div id="lost">The app stopped serving.<br>Restart it, then reload this page.</div>

  <script>
    const canvas = document.getElementById("cupri");
    const ctx = canvas.getContext("2d", { alpha: false });
    const lost = document.getElementById("lost");
    const dpr = Math.min(window.devicePixelRatio || 1, 2); // cap: every extra pixel is bandwidth

    const ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
    ws.binaryType = "blob";
    const send = o => { if (ws.readyState === 1) ws.send(JSON.stringify(o)); };

    // Canvas backing store is in device pixels; the server is told both so it can render sharp
    // on HiDPI while input keeps working in CSS pixels.
    function sizeCanvas() {
      const w = canvas.clientWidth || 940, h = canvas.clientHeight || 720;
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      send({ t: "size", w, h, dpr });
    }
    window.addEventListener("resize", sizeCanvas);

    // Frames arrive as PNG blobs; decode off the main thread and blit. Dropping a frame when one is
    // already decoding keeps a slow client from queueing up lag.
    let decoding = false;
    ws.onmessage = async ev => {
      if (typeof ev.data === "string") {
        const m = JSON.parse(ev.data);
        if (m.t === "cursor") canvas.style.cursor = m.v;
        else if (m.t === "open") window.open(m.href, "_blank", "noopener");
        return;
      }
      if (decoding) return;
      decoding = true;
      try {
        const bmp = await createImageBitmap(ev.data);
        ctx.drawImage(bmp, 0, 0);
        bmp.close();
      } finally { decoding = false; }
    };

    ws.onopen = () => sizeCanvas();
    ws.onclose = () => { lost.style.display = "grid"; };

    // Pointer + wheel in CSS pixels — the same coordinate space the desktop host dispatches in.
    const at = e => { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
    canvas.addEventListener("pointerdown", e => { const [x, y] = at(e); send({ t: "down", x, y, n: e.detail || 1 }); });
    canvas.addEventListener("pointermove", e => { const [x, y] = at(e); send({ t: "move", x, y }); });
    canvas.addEventListener("pointerup", e => { const [x, y] = at(e); send({ t: "up", x, y }); });
    canvas.addEventListener("contextmenu", e => { const [x, y] = at(e); send({ t: "ctx", x, y }); e.preventDefault(); });
    canvas.addEventListener("wheel", e => { const [x, y] = at(e); send({ t: "wheel", x, y, dy: e.deltaY }); e.preventDefault(); },
                            { passive: false });

    // Keys: named ones map to CupriFace.Interaction.EditKey, printable ones go as text.
    // Window-level (not the canvas) so app chords like Ctrl+K beat the browser's own — see the
    // WASM host, which had exactly this bug.
    const EK = { Backspace: 1, Delete: 2, ArrowLeft: 3, ArrowRight: 4, Home: 5, End: 6, Enter: 7, ArrowUp: 8, ArrowDown: 9, Escape: 13 };
    window.addEventListener("keydown", e => {
      const ctrl = e.ctrlKey || e.metaKey;
      const mods = (e.shiftKey ? 1 : 0) | (ctrl ? 2 : 0);
      if (ctrl) {
        const k = e.key.toLowerCase();
        if (k === "a") { send({ t: "key", k: 14, m: 0 }); e.preventDefault(); return; }
        if (k.length === 1) { send({ t: "char", s: k, m: mods }); e.preventDefault(); return; } // app chord
      }
      if (e.key === "Tab") { send({ t: "key", k: e.shiftKey ? 11 : 10, m: 0 }); e.preventDefault(); return; }
      if (e.key === " ") { send({ t: "key", k: 12, m: mods }); e.preventDefault(); return; }
      if (e.key in EK) { send({ t: "key", k: EK[e.key], m: mods }); e.preventDefault(); return; }
      if (e.key.length === 1 && !ctrl) { send({ t: "char", s: e.key, m: mods }); e.preventDefault(); }
    });
  </script>
</body>

</html>
